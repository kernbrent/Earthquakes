<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><meta name="robots" content="noindex,nofollow"><title>Team Admin | NTX Earthquakes</title><link rel="stylesheet" href="/admin/styles.css"><script src="/admin/app.js" defer></script></head><body><header><a href="/">NTX EARTHQUAKES</a><span>Team administration</span><button id="logout" hidden>Sign out</button></header><main><section id="login"><h1>Team admin</h1><p>Manage the information shown on the team website.</p><form id="login-form"><label>Username<input name="username" autocomplete="username" required></label><label>Password<input name="password" type="password" autocomplete="current-password" required></label><button type="submit">Sign in</button></form></section><section id="editor" hidden><h1>Keep the team up to date.</h1><p>Manage events, players, and game results. These records appear on the public website.</p><nav aria-label="Team data"><button data-tab="calendar" aria-pressed="true">Calendar</button><button data-tab="roster" aria-pressed="false">Roster</button><button data-tab="results" aria-pressed="false">Results</button></nav><div class="actions"><h2 id="section-title">Calendar</h2><button id="add">Add record</button><button id="reload">Reload</button><button id="save">Save changes</button></div><div id="rows"></div><p id="empty" hidden>No records yet. Add the first one above.</p></section><p id="status" role="status"></p></main></body></html>
